<meta charset="utf-8">
<title>Erz.26:Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ── Erz. tournament series ────────────────────────────────────────────
   紙のプレーヤーズガイドに寄せた明るい面。1つの明度に決め打ちした設計なので、
   色はすべてここで明示的に塗る（地の色を借りない）。
   フォーマット色はガイド原本の値そのまま＝白地に載せる前提で選ばれている。  */
:root{
  --ground:#F6F8F7;
  --surface:#FFFFFF;
  --surface-2:#EDF2F1;
  --line:#D2DDDA;
  --line-soft:#E4EBE9;
  --ink:#121A19;
  --ink-2:#4F6360;
  --ink-3:#7B8D8A;
  /* テーマカラー。明るい地では「塗り」と「文字」で別の明度が要るので役割で分ける。
     brand      = 塗り（帯・チップ・ロゴ）。この上の文字は必ず --on-brand
     brand-text = 明るい地に載せる文字としてのテーマカラー
     brand-pale/-line = 面と罫の淡い方                                   */
  --brand:#0ABAB5;        /* ロゴ・罫・帯など、文字が載らない面 */
  --brand-fill:#0B9F9A;   /* 文字を載せる塗り。白抜きが読める明度まで一段落とす */
  --on-brand:#FFFFFF;
  --brand-text:#0C7F7A;
  --brand-pale:#D7F3F1;
  --brand-line:#8FDCD7;
  --gold:#9C6B1F;
  --live:#C2417A;
  --ring:#9B2233;   /* RING ARENA。種目チップは白抜きなので、白が読める濃さにする */

  --f-nlh:#2C3C73; --f-plo:#B07C3E; --f-mix:#395C3B;
  --f-nl:#834677;  --f-other:#CD507D;
  --t-premier:#6B6850; --t-eclipse:#642E68;

  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --wrap:780px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--brand-text)}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 18px}

/* ── ヘッダ ───────────────────────────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:40;background:rgba(246,248,247,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--brand-line);
  border-top:3px solid var(--brand);
}
.top-in{display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:var(--wrap);margin:0 auto}
.mark{flex:none;height:36px;width:auto;display:block}
.top-txt{min-width:0;flex:0 1 auto}
.top-name{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 副題は**主題と同じ幅**に組む（本人指示 2026-10-02）。
   ⚠️ `width:0; min-width:100%` が肝 —— これが無いと副題の素の幅が
   入れ物の幅を決めてしまい、主題より広くなって揃わない。
   幅を0と見せかけて親の幅いっぱいに敷く、という書き方。
   ⚠️ 両端揃え（text-align-last:justify）は**単語の間だけが開く**ので
   「TOURNAMENT      SERIES」と不自然に離れる。字送りで均等に散らす
   （実際の調整は fitSubtitle）。 */
.top-sub{font-size:10.5px;color:var(--ink-3);font-family:var(--display);font-weight:600;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;letter-spacing:0;
  width:0;min-width:100%}
.state{
  flex:none;font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.12em;
  padding:4px 9px;border:1px solid var(--brand);color:var(--brand-text);white-space:nowrap;
}
.state.live{border-color:var(--live);color:var(--live)}

.tabs{display:flex;border-bottom:1px solid var(--line);max-width:var(--wrap);margin:0 auto;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:11px 12px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;
  color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand)}

/* ── 見出し帯 ─────────────────────────────────────────────────────── */
.banner{padding:26px 0 20px;border-bottom:1px solid var(--line-soft)}
.banner h1{
  margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);
  letter-spacing:-.035em;line-height:1;text-wrap:balance;
}
.banner h1 .titlelogo{display:block;width:100%;max-width:480px;height:auto}
.top-name .titlelogo{display:block;height:19px;width:auto;max-width:100%;object-fit:contain;object-position:left}
/* 開始・レイト締切のカウントダウン。押すとそのトーナメントが開く。
   **環境で崩れないこと**が要件なので、幅が足りなければ行ごと折り返し、
   見出し側だけを縮める（時間は絶対に欠けさせない）。 */
/* タイマーは**2つで1かたまり**。#01 と #02 が別の行に分かれると読みにくいので
   折り返さない（2つで入らない幅では、かたまりごと次の行へ送る）。 */
.cds{display:flex;gap:8px;flex-wrap:nowrap;min-width:0}
.cds:empty{display:none}
/* 320px 級のごく狭い画面だけは、はみ出すより折り返す */
@media (max-width:355px){.cds{flex-wrap:wrap}}
/* 狭い画面はヘッダーの余白を詰める（主題のロゴが縮むのを少しでも遅らせる） */
@media (max-width:360px){.top-in{gap:10px;padding:12px 12px}}
.cd{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;cursor:pointer;flex:none;
  border:1px solid var(--brand-line);background:var(--brand-pale);
  color:var(--brand-text);font-family:var(--display)}
.cd:hover{border-color:var(--brand-text)}
/* ⚠️ 状態が変わっても**箱の幅を動かさない**（本人指示 2026-10-02）。
   ラベルは `LATE REG:` が、時間は `10:24:47` が最長なので、そこに幅を固定する。 */
.cd .tk{flex:none;font-weight:700;font-size:9.5px;letter-spacing:.06em;white-space:nowrap}
.cd .tl{flex:none;font-weight:700;font-size:8.5px;letter-spacing:.06em;opacity:.75;white-space:nowrap;
  min-width:50px}
.cd .tv{flex:none;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;
  min-width:62px;text-align:right}
/* レイト受付が開いている間は色を変える（締切を見落とさせない） */
.cd.late{border-color:var(--live);background:transparent;color:var(--live)}
.cd.late:hover{border-color:var(--live)}
/* 締切後の進行中は主張させない */
.cd.run{border-color:var(--line);background:var(--surface);color:var(--ink-2)}
.period-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.sns-mini{display:flex;gap:6px;flex:none}
.sns-mini a{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  transition:border-color .12s,color .12s}
.sns-mini a:hover{border-color:var(--brand);color:var(--brand-text)}
.sns-mini svg{width:16px;height:16px;display:block}
.banner .period{
  display:inline-block;background:var(--brand-fill);color:var(--on-brand);
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em;padding:4px 10px;
}
.banner .meta{margin-top:12px;font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 16px}
.banner .meta b{color:var(--ink);font-weight:500}
.metalink{font:inherit;color:var(--brand-text);border-bottom:1px solid var(--brand-line);padding:0 0 1px}
.metalink b{color:var(--brand-text);font-weight:700}
.metalink:hover{border-bottom-color:var(--brand-text)}

/* ── フィルタ ─────────────────────────────────────────────────────── */
.filters{position:sticky;top:var(--topbar,104px);z-index:30;background:var(--ground);padding:12px 0 10px;border-bottom:1px solid var(--line-soft)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:5px 11px;border:1px solid var(--line);color:var(--ink-2);
  font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.06em;white-space:nowrap;
  transition:border-color .12s,color .12s;
}
.chip:hover{border-color:var(--brand-line);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.sat[aria-pressed="true"]{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
/* 区分のチップは、行に付くバッジと同じ色で対応が分かるようにする */
.chip.tag.PREMIER{color:var(--t-premier)}
.chip.tag.ECLIPSE{color:var(--t-eclipse)}
.chip.tag.PREMIER[aria-pressed="true"]{background:var(--t-premier);border-color:var(--t-premier);color:#fff}
.chip.tag.ECLIPSE[aria-pressed="true"]{background:var(--t-eclipse);border-color:var(--t-eclipse);color:#fff}
.days{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-btn{
  flex:none;min-width:54px;padding:5px 8px 6px;text-align:center;border-bottom:2px solid transparent;color:var(--ink-3);
}
.day-btn .d{display:block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:-.01em;line-height:1.2}
.day-btn .w{font-size:9.5px;letter-spacing:.08em}
.day-btn[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brand-text)}

/* ── 日付セクション + 行 ──────────────────────────────────────────── */
.daysec{margin-top:26px}
.dayhead{display:flex;align-items:baseline;gap:10px;padding-bottom:7px;border-bottom:2px solid var(--brand)}
.dayhead .dd{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.dayhead .dw{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.dayhead .dn{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono)}

.row{
  position:relative;border-bottom:1px solid var(--line-soft);
  border-left:2px solid transparent;transition:background .12s,border-color .12s;
}
.row:hover{background:var(--surface);border-left-color:var(--line)}
.row.done{background:var(--surface)}
.row.done{border-left-color:var(--brand)}
.row.faved{border-left-color:var(--gold)}
.row-main{display:block;width:100%;text-align:left;padding:13px 34px 13px 12px}
.fav{
  position:absolute;top:9px;right:-2px;width:32px;height:32px;display:grid;place-items:center;
  font-size:16px;line-height:1;color:var(--ink-3);transition:color .12s,transform .12s;
}
.fav:hover{color:var(--ink-2);transform:scale(1.12)}
.fav[aria-pressed="true"]{color:var(--gold)}
.chip.fav-chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
.row-top{display:flex;align-items:flex-start;gap:9px}
.eno{
  font-family:var(--display);font-weight:700;font-size:12px;color:var(--ink-3);
  padding-top:3px;min-width:26px;letter-spacing:-.01em;
}
.fmt{
  flex:none;margin-top:1px;padding:2px 7px;font-family:var(--display);font-weight:700;font-size:10.5px;
  letter-spacing:.06em;color:#fff;background:var(--f-nlh);
}
.fmt.PLO{background:var(--f-plo)}
.fmt.MIX,.fmt.FLMIX{background:var(--f-mix)}
.fmt.NL{background:var(--f-nl)}
.fmt.RING{background:var(--ring)}
.row.ring{border-left-color:var(--ring)}
.fmt.OTHER{background:var(--f-other)}
.row-body{flex:1;min-width:0}
.ename{display:block;font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;line-height:1.28}
.ename .esub{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.row-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tg{font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.09em;padding:2px 6px;border:1px solid currentColor}
.tg.PREMIER{color:var(--t-premier)}
.tg.ECLIPSE{color:var(--t-eclipse)}
.tg.SAT{color:var(--brand-text)}
.row-time{flex:none;text-align:right;padding-top:1px}
.row-time .st{display:block;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.row-time .re{display:block;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:3px;white-space:nowrap}
.row-fee{margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.row-fee .sep{color:var(--ink-3);margin:0 6px}
.row-res{
  margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 9px;background:var(--brand-pale);
}
.row-res .lab{flex:none;font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.12em;color:var(--brand-text)}
.row-res .win{font-weight:700;font-size:14px}
.row-res .ent{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.empty{padding:36px 0;text-align:center;color:var(--ink-3);font-size:13.5px}

/* ── 詳細ビュー ───────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:60;background:var(--ground);overflow-y:auto;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet-bar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:11px 18px;background:rgba(246,248,247,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.back{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--brand-text)}
/* 長いページを読み切ったあと、上まで戻らずに閉じられるように下にも置く */
.back-bottom{display:block;width:100%;padding:15px 0;margin:4px 0 0;text-align:center;
  border:1px solid var(--line);background:var(--surface);
  font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--brand-text)}
.back-bottom:hover{border-color:var(--brand)}
.sheet-bar .who{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.hero{padding:22px 0 20px;border-bottom:1px solid var(--line-soft)}
.hero-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-no{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em;background:var(--brand-fill);color:var(--on-brand);padding:3px 9px}
.hero h2{margin:12px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(27px,7vw,40px);letter-spacing:-.035em;line-height:1.02;text-wrap:balance}
.hero h2 small{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--ink-3);margin-bottom:4px;text-transform:uppercase}
.hero-when{margin-top:14px;display:flex;flex-wrap:wrap;border:1px solid var(--line)}
.hero-when div{flex:1;min-width:33%;padding:9px 12px;border-right:1px solid var(--line)}
.hero-when div:last-child{border-right:0}
.hero-when .k{font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.12em;color:var(--ink-3)}
.hero-when .v{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:1px}

section.blk{padding:22px 0;border-bottom:1px solid var(--line-soft)}
.blk h3{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--brand-text);text-transform:uppercase}
.buyin{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.buyin > div{background:var(--surface);padding:10px 12px;display:flex;align-items:baseline;gap:10px}
.buyin .k{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--ink-2);min-width:104px}
.buyin .v{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.buyin .v em{font-style:normal;color:var(--ink-3);font-size:12px;font-weight:600}
.buyin .x{color:var(--ink-3)}
.buyin > div.lead{background:var(--surface-2)}
.buyin > div.lead .v{font-size:20px;color:var(--brand-text)}
.notes{margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink-2)}
.notes li{padding-left:13px;position:relative}
.notes li::before{content:"・";position:absolute;left:0;color:var(--ink-3)}

.special{border:1px solid var(--brand-line);border-left:3px solid var(--brand);padding:13px 14px;background:linear-gradient(180deg,var(--brand-pale),transparent)}
.special .lab{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--brand-text)}
.special .hl{font-weight:700;font-size:19px;margin-top:3px;line-height:1.3}
.special .bd{font-size:12.5px;color:var(--ink-2);margin-top:5px}

.ladder{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.ladder .pr{background:var(--surface);display:flex;gap:11px;padding:10px 12px;align-items:flex-start}
.ladder .pl{flex:none;min-width:44px;text-align:center;font-family:var(--display);font-weight:700;font-size:12px;background:var(--brand-pale);color:var(--brand-text);padding:3px 6px;letter-spacing:.02em}
.ladder .pr:first-child .pl{background:var(--brand-fill);color:var(--on-brand)}
.ladder .pv{display:block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.35}
.ladder .ps{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.tierlab{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--ink-2);margin:14px 0 6px}
.tierlab:first-child{margin-top:0}
/* リーダーボードのプライズ。2列に並べ、1位だけ2列ぶんを使う。
   特典はどの順位も同じ大きさで出す（1位の2つ目だけ小さいと格落ちに見える） */
.lbladder{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
.lbladder .pr{align-items:flex-start}
.lbladder .pr.wide{grid-column:1/-1}
.lbladder .pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lbladder .pbody .pv + .pv{margin-top:7px}
.lbladder .psub{display:block;font-family:var(--display);font-weight:700;font-size:12.5px;
  letter-spacing:.02em;color:var(--brand-text);margin-top:1px}
@media (max-width:560px){ .lbladder{grid-template-columns:1fr} }
.prizenote{margin-top:10px;font-size:12px;color:var(--ink-2)}

.tblwrap{overflow-x:auto;border:1px solid var(--line-soft)}
table.st{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
table.st th{background:var(--brand-fill);color:var(--on-brand);font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.1em;padding:6px 10px;text-align:center}
table.st td{padding:6px 10px;text-align:center;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
table.st td:first-child{color:var(--ink-3)}
table.st tr.brk td{background:var(--surface-2);color:var(--ink-2);font-family:var(--body);font-size:11.5px;letter-spacing:.04em}
table.st tr:last-child td{border-bottom:0}
table.st td.desc{white-space:normal;text-align:left;font-family:var(--body);font-size:12px;line-height:1.5;min-width:220px}

.lbrule{font-size:12.5px;color:var(--ink-2)}
.lbrule .mult{display:inline-block;font-family:var(--display);font-weight:800;font-size:15px;color:var(--brand-text);border:1px solid var(--brand-line);padding:1px 8px;margin-bottom:8px}
.venue .vn{font-family:var(--display);font-weight:700;font-size:18px}
.venue .va{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.venue .vf{margin-top:12px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.venue .vf .r{display:flex;gap:10px;align-items:baseline}
.venue .vf .r span{color:var(--ink-2)}
.venue .vf .r b{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--ink)}
.venue .vx{margin-top:10px;font-size:12px;color:var(--gold)}

/* ── リザルト ─────────────────────────────────────────────────────── */
.resbox{border:1px solid var(--line)}
.resbox.none{border-style:dashed;color:var(--ink-3);text-align:center;font-size:13px;padding:20px 14px}
.resphoto{
  display:block;width:100%;height:auto;max-height:420px;object-fit:contain;
  background:var(--surface-2);border-bottom:1px solid var(--line);
}
/* 項目が4つになるので折り返す。狭い画面では2列×2段 */
.resmeta{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.resmeta > div{flex:1 1 25%;min-width:104px;padding:9px 12px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft)}
.resmeta > div:last-child{border-right:0}
.resmeta .sub{font-size:10px;color:var(--ink-3);margin-top:2px;white-space:nowrap}
.resmeta .big.sm{font-size:16px}
.resmeta .lab{font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.12em;color:var(--ink-3)}
.resmeta .big{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}
.fin{display:flex;flex-direction:column;padding:4px 12px 10px}
.fin .f{display:flex;gap:11px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.fin .f:last-child{border-bottom:0}
.fin .fp{flex:none;min-width:34px;font-family:var(--display);font-weight:700;font-size:12px;color:var(--ink-3)}
.fin .f.win .fp,.fin .f.win .fn{color:var(--gold)}
.fin .fn{font-weight:700;font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}
.fin .fpt{font-family:var(--mono);font-size:12px;color:var(--brand-text);min-width:58px;text-align:right}
.partlist{padding:0 12px 12px}
.partlist .pt-lab{font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:6px}
.partlist .names{display:flex;flex-wrap:wrap;gap:5px}
.partlist .nm{font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:2px 8px;white-space:nowrap}
.partlist .nm b{font-family:var(--mono);font-weight:400;color:var(--ink-3);margin-left:5px;font-size:11px}

/* ── リーダーボード ───────────────────────────────────────────────── */
.lbtbl{width:100%;border-collapse:collapse}
.lbtbl th{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--ink-3);text-align:left;padding:0 8px 7px;border-bottom:1px solid var(--line)}
.lbtbl th.r,.lbtbl td.r{text-align:right}
.lbtbl td{padding:9px 8px;border-bottom:1px solid var(--line-soft);font-size:14px}
.lbtbl .rk{font-family:var(--display);font-weight:800;font-size:15px;width:42px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lbtbl tr.top3 .rk{color:var(--gold)}
.lbtbl .pl{font-weight:700;overflow-wrap:anywhere}
.lbtbl .pt{font-family:var(--display);font-weight:800;font-size:16px;color:var(--brand-text);font-variant-numeric:tabular-nums}
.lbtbl .cs{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.lbtbl tr.cut td{padding:0;border-bottom:0}
.lbtbl .cutline{
  display:flex;align-items:center;gap:9px;margin:10px 0 4px;
  font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.11em;color:var(--brand-text);
}
.lbtbl .cutline::after{content:"";flex:1;height:1px;background:var(--brand)}
/* 上位3人は表ではなく札で大きく出す（1〜20位が単調なため。本人指示 2026-10-03）。
   同率が並べば p1 が2枚になることもある。 */
.podium{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pod{display:flex;align-items:center;gap:14px;padding:13px 15px;background:var(--surface);
  border:1px solid var(--line-soft);border-left:3px solid var(--line)}
.pod .pr{flex:none;min-width:34px;text-align:center;font-family:var(--display);font-weight:800;
  font-size:26px;line-height:1;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pod .pb{flex:1;min-width:0}
.pod .pn{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;overflow-wrap:anywhere}
.pod .pc{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px}
.pod .pp{flex:none;font-family:var(--display);font-weight:800;font-size:22px;
  color:var(--brand-text);font-variant-numeric:tabular-nums}
.pod .pp span{font-size:11px;margin-left:3px;color:var(--ink-3)}
.pod.p1{border-left-color:var(--gold);padding:18px 15px;
  background:linear-gradient(180deg,#FBF4E6,var(--surface) 70%)}
.pod.p1 .pr{font-size:34px;color:var(--gold)}
.pod.p1 .pn{font-size:25px}
.pod.p1 .pp{font-size:28px;color:var(--gold)}
.pod.p2{border-left-color:var(--ink-3)}
.pod.p3{border-left-color:var(--brand-line)}
@media (max-width:420px){
  .pod{gap:10px;padding:11px 12px}
  .pod .pn{font-size:17px}.pod.p1 .pn{font-size:20px}
  .pod .pp{font-size:19px}.pod.p1 .pp{font-size:23px}
}
.callout{border-left:3px solid var(--brand);padding:2px 0 2px 12px;font-size:12.5px;color:var(--ink-2);margin-top:14px}
.callout b{color:var(--ink);font-weight:500}
.more{margin-top:14px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--brand-line);
  color:var(--brand-text);font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.08em;transition:background .12s;
}
.btn:hover{background:var(--brand-pale)}

/* その日の見どころ。バナーはオレンジの帯だけを切り出した横長版 */
.feat{margin:16px 0 4px}
.feat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.feat-head .fh{font-family:var(--display);font-weight:800;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--brand-text)}
.feat-head .fd{font-family:var(--display);font-weight:700;font-size:11.5px;color:var(--ink-3)}
.feat-strip{display:flex;gap:10px}
.feat-card{display:block;padding:0;border:1px solid var(--line-soft);background:var(--surface);
  width:100%;flex:none;transition:border-color .12s,transform .12s;cursor:pointer}
.feat-card:hover{border-color:var(--brand);transform:translateY(-1px)}
.feat-card img{display:block;width:100%;height:auto}
/* 2本以上の日（土曜）は器の中だけで横スクロールし、次の1枚を覗かせる */
.feat-strip.multi{overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;padding-bottom:4px}
.feat-strip.multi .feat-card{width:88%;scroll-snap-align:start}
@media (min-width:700px){.feat-strip.multi .feat-card{width:calc(50% - 5px)}}

/* 招待選手。写真は優勝写真なので横長。1列で大きく出す */
.champs{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.champ{background:var(--surface)}
.cphoto{display:block;width:100%;height:auto}
.cphoto.none{aspect-ratio:3/2;background:var(--surface-2)}
.cbody{padding:13px 14px}
.cname{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.cwon{margin-top:5px;font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.crow{display:flex;gap:10px;align-items:baseline;margin-top:7px;font-size:13px}
.crow .ck{flex:none;min-width:48px;font-family:var(--display);font-weight:700;font-size:9.5px;
  letter-spacing:.12em;color:var(--ink-3)}
.crow .cv{flex:1;min-width:0;overflow-wrap:anywhere}
.crow .cv.link{text-align:left;color:var(--brand-text);border-bottom:1px solid var(--brand-line)}
.featimg{display:block;width:100%;height:auto;border:1px solid var(--line-soft)}
.sns-btns{display:flex;gap:9px;flex-wrap:wrap}
.sns-btns a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;
  border:1px solid var(--line);background:var(--surface);
  font-family:var(--display);font-weight:700;font-size:12.5px;transition:border-color .12s}
.sns-btns a:hover{border-color:var(--brand)}
.sns-btns svg{flex:none;width:17px;height:17px;display:block}
.infolist{display:flex;flex-direction:column;gap:9px;font-size:13px}
.infolist .ir{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line-soft);padding-bottom:9px}
.infolist .ir:last-child{border-bottom:0}
.infolist .ik{flex:none;min-width:80px;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}
.infolist .iv{flex:1;min-width:0}

.foot{padding:28px 0 46px;color:var(--ink-3);font-size:11.5px;line-height:1.8}
.foot .fbrand{display:block;width:210px;max-width:60%;height:auto;margin-bottom:10px}
</style>

/* ── ポイント計算 ─────────────────────────────────────────────────────
   運用中の集計表の式をそのまま再現している(全セルで照合済み)。
     優勝ポイント = max(総E数 × 10, 200) × 倍率     ※200保証は倍率をかける前
     順位ポイント = 1順位ごとに半分・5点単位で切り上げ。10点未満になったら 0
     エントリーP  = 本人のE数 × 10 × 倍率                                    */
const ceil5 = x => Math.ceil(x / 5) * 5;
function placePoints(base, place) {
  let p = base;

  return p;
}

function leaderboard() {
  const by = new Map();
  const add = (name, pts, opt) => {
    const n = canon((name || "").trim());
    if (!n || !pts) return;
    const cur = by.get(n) || {name:n, points:0, wins:0, cashes:0, best:99, rings:0};
    cur.points += pts;
    if (opt && opt.place) {
      // 優勝は入賞に数えない（二重に見えるため。本人指示 2026-10-03）
      if (opt.place === 1) cur.wins++; else cur.cashes++;
      cur.best = Math.min(cur.best, opt.place);
    }
    if (opt && opt.ring) cur.rings++;
    by.set(n, cur);
  };
  for (const ev of DATA.events) {
    const r = RESULTS[ev.id];
    if (!r) continue;
    for (const f of r.finishers) add(f.name, f.points, {place:f.place});
    for (const p of (r.participants || [])) add(p.name, p.points, null);
  }
  for (const rg of RINGS) for (const f of rg.finishers) add(f.name, f.points, {ring:true});
  return [...by.values()].sort((a,b) =>
    b.points - a.points || a.best - b.best || a.name.localeCompare(b.name,"ja"));
}

}

/* 会期の右に置く店のアカウント。アイコンだけで、読み上げには名前を持たせる */
/* 予定表の時刻を実時刻に直す。**日付は営業日（正午区切り）**なので、
   午前の時刻はその翌日、`24:00` は翌日の0時として読む。
   例: 10-02 の `23:00` は10/2の夜、同じ 10-02 の `03:30` は10/3の明け方。 */
function evTime(dateISO, hhmm) {
  const [y, m, d] = dateISO.split("-").map(Number);
  let [h, mi] = String(hhmm).split(":").map(Number);
  let plus = 0;
  if (h >= 24) { h -= 24; plus = 1; } else if (h < 12) { plus = 1; }
  return new Date(y, m - 1, d + plus, h, mi || 0, 0, 0);
}
const evStart = e => evTime(e.date, e.start);
function evRegEnd(e) {
  const s = evStart(e), r = evTime(e.date, e.reg_end);
  if (r <= s) r.setDate(r.getDate() + 1);   // 締切が開始より前に出たら翌日
  return r;
}
/* 終了予定。シートの END（`end`）が入っていればそれ、無ければレイト締切まで */
function evEnd(e) {
  const s = evStart(e);
  if (!e.end) return evRegEnd(e);
  const x = evTime(e.date, e.end);
  if (x <= s) x.setDate(x.getDate() + 1);
  return x;
}
/* 出すのは **START と LATE REG の2つだけ**、最大2件（2026-10-02 本人指示）。
   レイト締切を過ぎた回は出さない —— 行が増えると下のバナーが遠くなるため。 */
function cdItems(now) {

  const soon = xs.filter(v => v.s > now).sort((a, b) => a.s - b.s)
                 .map(v => ({ ev: v.e, kind: "start", at: v.s }));
  return late.concat(soon).slice(0, 2);
}
function hms(ms) {
  const t = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, "0");
  const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600),
        m = Math.floor(t % 3600 / 60), sec = t % 60;
  return d ? `${d}日 ${h}:${p(m)}` : `${h}:${p(m)}:${p(sec)}`;
}

/* 副題「TOURNAMENT SERIES」を主題と同じ幅に広げる。
   **字送りを全体に散らす**ので、単語の間だけが開くことがない。
   入れ物の幅はCSSの `width:0; min-width:100%` で主題と同じになっているので、
   目標は `clientWidth` をそのまま使えばよい。中身の幅は Range で測る
   （要素の箱を測ると親の幅が返ってきて、常に一致してしまう）。 */
function fitSubtitle() {
  const sb = document.getElementById("topSub");
  if (!sb) return;
  const chars = (sb.textContent || "").trim().length;
  if (chars < 2) return;
  const inner = () => {
    const r = document.createRange(); r.selectNodeContents(sb);
    return r.getBoundingClientRect().width;
  };
  sb.style.fontSize = ""; sb.style.letterSpacing = "0px"; sb.style.marginRight = "0px";
  const target = sb.clientWidth;
  if (!target) return;
  let nat = inner();
  if (!nat) return;
  if (nat > target) {                       // 字送りで詰めきれないときは字を小さく
    const base = parseFloat(getComputedStyle(sb).fontSize) || 10.5;
    sb.style.fontSize = Math.max(6, base * target / nat).toFixed(2) + "px";
    nat = inner();
  }
  const add = Math.min(6, Math.max(-0.4, (target - nat) / chars));
  sb.style.letterSpacing = add.toFixed(3) + "px";
  sb.style.marginRight = (-add).toFixed(3) + "px";   // 最後の1文字の後ろぶんを打ち消す
}

/* ── LEADERBOARD ──────────────────────────────────────────────────── */
/* 同率は**上位の同順位**（1,2,2,4…）。特典の区切りも順位で引くので、
   5位に3人並べばその3人とも「1-5位プライズ」に入る（本人指示 2026-10-03）。 */
function withRanks(lb) {
  let rank = 0, prev = null, n = 0;
  return lb.map(p => {
    n++;
    if (prev === null || p.points !== prev) { rank = n; prev = p.points; }
    return Object.assign({}, p, { rank });
  });
}
const CUTS = [[5, "1 - 5位 プライズ"], [10, "6 - 10位 プライズ"],
              [20, "11 - 20位 抽選プライズ"], [Infinity, "21位以下"]];
const cutOf = r => (CUTS.find(c => r <= c[0]) || CUTS[CUTS.length - 1])[1];
const recOf = p => [p.wins ? "優勝:" + p.wins : "", p.cashes ? "入賞:" + p.cashes : "",
                    p.rings ? "RING:" + p.rings : ""].filter(Boolean).join(" / ");

function renderLeaderboard() {
  const all = withRanks(leaderboard());
  const lbd = DATA.leaderboard;
  let limit = state.lbAll ? all.length : 20;
  // ⚠️ 20人目で機械的に切ると**同率の片方だけが隠れる**（本人指摘 2026-10-03）。
  //    同じ順位の人は最後まで出し切る。
  if (limit < all.length) {
    const r = all[limit - 1].rank;
    while (limit < all.length && all[limit].rank === r) limit++;
  }
  const shown = all.slice(0, limit);
  const pod = shown.filter(p => p.rank <= 3);
  const rest = shown.filter(p => p.rank > 3);
  let last = pod.length ? cutOf(pod[0].rank) : null;
  let rows = "";
  rest.forEach(p => {
    const c = cutOf(p.rank);
    if (c !== last) { rows += `<tr class="cut"><td colspan="4"><div class="cutline">${c}</div></td></tr>`; last = c; }
    rows += `<tr>
      <td class="rk">${p.rank}</td>
      <td class="pl">${esc(p.name)}</td>
      <td class="r cs">${recOf(p)}</td>
      <td class="r pt">${p.points.toLocaleString("ja-JP")}</td></tr>`;
  });
  const podHTML = pod.length ? `<div class="podium">
      ${pod.map(p => `<div class="pod p${p.rank}">
        <div class="pr">${p.rank}</div>
        <div class="pb"><div class="pn">${esc(p.name)}</div>
          ${recOf(p) ? `<div class="pc">${recOf(p)}</div>` : ""}</div>
        <div class="pp">${p.points.toLocaleString("ja-JP")}<span>P</span></div>
      </div>`).join("")}
    </div>` : "";
  return `<div class="banner">
      <h1>Leaderboard</h1>
      <div class="meta">
        ${all.length ? `<span><b>${all.length}</b> players</span>` : ""}
        <span>${DATA.events.length} tournaments${RINGS.length ? ` + ${RINGS.length} ring nights` : ""}</span>
      </div>
    </div>
    ${all.length ? `
    <section class="blk">
      ${pod.length ? `<div class="cutline" style="margin-bottom:10px">${cutOf(pod[0].rank)}</div>` : ""}
      ${podHTML}
      ${rows ? `<table class="lbtbl">
        <thead><tr><th>#</th><th>PLAYER</th><th class="r">RECORD</th><th class="r">POINT</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : ""}
      ${all.length > limit ? `<div class="more"><button class="btn" data-lball="1">残り ${all.length - limit} 人を表示</button></div>` : ""}
    </section>` : ""}
    ${lbd.point_rules && lbd.point_rules.length === 0 && !all.length ? "" : `
    <section class="blk">
      <h3>Point</h3>
      <div class="lbrule">
        <ul class="notes">
          <li>優勝ポイント ＝ 総エントリー数 × 10（最低 200）。<b>PREMIER</b> はその 1.5倍</li>
          <li>以下1順位ごとに上位ポイントの 50%（5ポイント単位で切り上げ）。10ポイントを下回る順位は付与なし</li>
          <li>エントリーポイント ＝ 本人のエントリー数（リエントリー含む）× 10</li>
          <li>リングゲームは純増ポイント1位に 160、以下1順位ごとに 50%</li>
        </ul>
      </div>
      <div class="callout">同一プレイヤーの表記ゆれは名寄せして合算しています。</div>
    </section>`}
    ${lbd.prizes.length ? `
    <section class="blk">
      <h3>Prize</h3>
      <div class="ladder lbladder">
        ${lbd.prizes.map((p, i) => `<div class="pr${i === 0 ? " wide" : ""}"><span class="pl">${esc(p.rank)}</span>
          <span class="pbody">${p.items.map(lbPrizeItem).join("")}</span></div>`).join("")}
      </div>
      ${lbd.prize_note ? `<div class="prizenote">※ ${esc(lbd.prize_note)}</div>` : ""}
    </section>` : `<section class="blk"><div class="resbox none">リーダーボードの規定とプライズは準備中です</div></section>`}
    ${footHTML()}`;
}

/* リーダーボードのプライズ1項目。文字列でも {main, sub} でも受ける。
   末尾の「※…」は注記なので小さく出す（どの順位でも同じ扱い）。 */
function lbPrizeItem(x) {
  const o = typeof x === "string" ? { main: x } : x;
  const m = /^(.*?)\s*(※.*)$/.exec(o.main || "");
  const main = m ? m[1] : (o.main || ""), note = m ? m[2] : null;
  return `<span class="pv" style="font-size:14px">${esc(main)}</span>`
    + (o.sub ? `<span class="psub">${esc(o.sub)}</span>` : "")
    + (note ? `<span class="ps">${esc(note)}</span>` : "");
}

/* 開催の何日目か。**境目は正午**（深夜3時のトーナメントは前日の続きなので、
   0時で日付を切ると Day がずれる）。会期の前後では COMING / FINISHED。 */
function businessDate(t) {
  const d = new Date(t.getTime() - 12 * 3600 * 1000);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
/* いま進行中の回、無ければ次に来る回の日付。Day表示と FEATURE の基準にする */
function playDay() {
  const now = new Date();
  const ahead = DATA.events.map(e => ({ e, s: evStart(e), x: evEnd(e) }))
                  .filter(v => v.x > now).sort((a, b) => a.s - b.s);
  return ahead.length ? ahead[0].e.date : null;
}
function seriesState() {
  const pr = DATA.series.period;
  if (!pr || !pr.from) return "";
  const ymd = x => { const [y, m, d] = x.split("-").map(Number); return new Date(y, m - 1, d); };
  const from = ymd(pr.from), now = new Date();
  const cal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (cal < from) return "COMING";
  // ⚠️ 正午で切ると**朝8時がまだ Day 1 のまま**になる（本人指摘 2026-10-03）
  const d = playDay();
  if (!d) return "FINISHED";
  return "Day " + (Math.round((ymd(d) - from) / 86400000) + 1);
}

/* Champion's Bounty。**前回のシリーズ終了から今回までに大型大会で優勝した会員**を招く。
   載せるのは 名前 / 優勝したトーナメント / この回のどこにゲスト参戦するか の3つだけ
   （2026-10-02 本人指示）。写真はその優勝写真をそのまま使う。 */
/* 並びは**参戦トーナメントの番号順**で、**終わった回は最後方**へ送る
   （2026-10-02 本人指示）。参戦先が未定の人はその間に置く。
   `hidden` の人は出さない（参戦許可が取れていないなど。データは残す）。 */
function champPlayers() {
  const ch = DATA.series.champions || {};
  const today = businessDate(new Date());
  const ymd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
  // 深夜のトーナメントは前日の日付で並んでいるので、ev.date をそのまま使ってよい
  const done = no => {
    const ev = DATA.events.find(e => e.no === no);
    return !!(ev && ev.date && ymd(ev.date) < today);
  };
  return (ch.players || []).filter(p => !p.hidden).map((p, i) => {
    const no = p.guest_no || 0;
    const rank = !no ? 1 : (done(no) ? 2 : 0);   // 0=これから 1=未定 2=終了
    return { p, k: [rank, no || 0, i] };
  }).sort((a, b) => a.k[0] - b.k[0] || a.k[1] - b.k[1] || a.k[2] - b.k[2])
    .map(x => x.p);
}

function renderChampions() {
  const ch = DATA.series.champions;
  if (!ch) return renderInfo();
  const pl = champPlayers();
  return `<div class="banner"><h1>${esc(ch.title || "Champion's Bounty")}</h1>

function renderFeature() {
  const f = DATA.series.feature;
  if (!f) return renderInfo();
  return `<div class="banner"><h1>${esc(f.title)}</h1>
      <div class="period">${esc(f.when)}</div>
      <div class="meta"><span>Venue <b>${esc(f.venue)}</b></span></div>
    </div>
    ${f.banner_src ? `<section class="blk" style="padding-top:18px">
      <img class="featimg" src="${f.banner_src}" alt="${esc(f.title)}"></section>` : ""}
    <section class="blk">
      <p style="margin:0 0 10px;font-size:15px;font-weight:500">${esc(f.lead)}</p>
      ${(f.body || []).map(t => `<p style="margin:0 0 8px;font-size:13.5px;color:var(--ink-2)">${esc(t)}</p>`).join("")}
      ${f.stream ? `<div class="callout" style="margin-top:12px"><b>${esc(f.stream)}</b></div>` : ""}
    </section>
    ${f.relation ? `<section class="blk"><div class="special">
      <div class="lab">LEADERBOARD</div>
      <div class="hl" style="font-size:15px;line-height:1.5">${esc(f.relation)}</div>
    </div></section>` : ""}
    <section class="blk"><h3>Official</h3>
      <div class="sns-btns">${(f.links || []).map(l => `
        <a href="${esc(l.url)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${SNS_PATH[l.kind] || ""}"/></svg>
          <span>${esc(l.label)}</span></a>`).join("")}</div>
      ${(f.series_note || []).map(t => `<div class="callout" style="margin-top:10px">${esc(t)}</div>`).join("")}
    </section>
    ${footHTML()}`;
}

/* ── INFO ─────────────────────────────────────────────────────────── */
function renderInfo() {
  const s = DATA.series, v = s.venue;
  return `<div class="banner"><h1>Information</h1></div>
    <section class="blk venue">
      <h3>Main Venue</h3>
      <div class="vn">${esc(v.name)}</div>
      <div class="va">${esc(v.address)}</div>
      <div class="vf">
        <div style="font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)">${esc(v.fee_label)}</div>
        ${v.fees.map(f => `<div class="r"><span>${esc(f.label)}${f.note ? " " + esc(f.note) : ""}</span><b>${esc(f.price)}</b></div>`).join("")}
      </div>
    </section>
    <section class="blk">
      <h3>Series</h3>
      <div class="infolist">
        <div class="ir"><span class="ik">NAME</span><span class="iv">${esc(s.full_name)}</span></div>
        <div class="ir"><span class="ik">PERIOD</span><span class="iv">${esc(s.period.label)}</span></div>
        <div class="ir"><span class="ik">EVENTS</span><span class="iv">${DATA.events.length} tournaments + RING ARENA ${DATA.ring.dates.length} nights</span></div>
        ${totalEntries() ? `<div class="ir"><span class="ik">ENTRIES</span><span class="iv">${totalEntries()}</span></div>` : ""}
      </div>
    </section>
    <section class="blk">
      <h3>Format</h3>
      <div class="chips" style="flex-wrap:wrap;gap:6px">
        ${[...new Set(DATA.events.map(e => e.format))].map(f => `<span class="fmt ${fmtClass(f)}">${esc(f)}</span>`).join("")}
      </div>
      ${(DATA.series.format_notes || []).map(n => `<div class="callout"><b>${esc(n.tag)}</b>　${esc(n.text)}</div>`).join("")}
      ${DATA.events.some(e => e.satellite)
        ? '<div class="callout"><b>JOPT</b>　JAPAN OPEN POKER TOUR のサテライト対象です。</div>' : ""}
    </section>
    ${contactHTML()}
    ${footHTML()}`;
}
/* ECLIPSE の案内。**その印が付いたトーナメントのページにだけ**出す
   （INFO にまとめると、対象の回を見ている人に届かない。2026-10-01 本人指示） */
function eclipseHTML(ev) {
  const ec = DATA.series.eclipse;
  if (!ec || !ev || !(ev.tags || []).includes("ECLIPSE")) return "";
  return `<section class="blk"><div class="special">
    <div class="lab">${esc(ec.title)}</div>
    ${ec.lines.map((l, i) => i === 0
      ? `<div class="hl" style="font-size:15px;line-height:1.5">${esc(l)}</div>`
      : `<div class="bd" style="margin-top:${i === 1 ? 8 : 2}px">${esc(l)}</div>`).join("")}
  </div></section>`;
}
/* 連絡先。**メールアドレスはページに出さない**（本人指示 2026-10-01）。
   静的なページなので受け口を持てず、Googleフォームへ飛ばす。
   回答は本人にメールで通知される。 */
function contactHTML() {
  const ct = DATA.series.contact;
  const href = ct && (ct.form_url || (ct.email && `mailto:${ct.email}`));
  if (!href) return "";
  return `<section class="blk">
    <h3>${esc(ct.label || "Contact")}</h3>
    <p style="margin:0 0 12px;font-size:13px;color:var(--ink-2)">${esc(ct.text || "")}</p>
    <a class="btn" href="${esc(href)}"${ct.form_url ? ' target="_blank" rel="noopener"' : ""}>${
      esc(ct.button || "連絡する")}</a>
  </section>`;
}

/* ── 詳細ビュー ───────────────────────────────────────────────────── */
function structureTable(ev) {
  const st = ev.structure ? DATA.structures[ev.structure] : null;
  if (!st) return '<div class="resbox none">ストラクチャーは準備中です</div>';
  const cols = st.columns, wide = cols.length === 5;
  const rows = st.rows.map(r => {
    if (r.kind === "break")
      return `<tr class="brk"><td colspan="${cols.length - 1}">${esc(r.label)}</td><td>${r.time}min</td></tr>`;
    const isDesc = typeof r.blinds === "string" && /[ぁ-んァ-ヶ一-龠]/.test(r.blinds);
    /* 列の並びは書き出し側（Structure Editor）が `cells` に入れてくる。
       表の型が増えてもここを直さずに済むよう、あればそれをそのまま使う。
       古いデータには無いので、その場合だけ列数から組み立てる。 */
    const cells = (Array.isArray(r.cells) && r.cells.length === cols.length) ? r.cells
      : wide ? [r.level, r.ante_bring, r.blinds, r.ante, r.time + "min"]
      : cols.length === 4 ? [r.level, r.blinds, r.ante == null ? "—" : r.ante, r.time + "min"]
      : [r.level, r.blinds, r.time + "min"];
    return "<tr>" + cells.map((c,i) => `<td${i === 1 && isDesc ? ' class="desc"' : ""}>${esc(c)}</td>`).join("") + "</tr>";
  }).join("");
  return `<div class="tblwrap"><table class="st">
    <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function ladderHTML(list) {
  return `<div class="ladder">${list.map(p => `<div class="pr">
    <span class="pl">${esc(p.place)}</span>
    <span><span class="pv">${esc(p.main)}</span>${p.sub ? `<span class="ps">${esc(p.sub)}</span>` : ""}</span>
  </div>`).join("")}</div>`;
}
function detailHTML(ev) {
  const e = ev.entry, p = dparts(ev.date), r = RESULTS[ev.id];
  const tags = [];
  if (ev.satellite) tags.push('<span class="tg SAT">JOPT</span>');
  for (const t of ev.tags) tags.push(`<span class="tg ${t}">${t}</span>`);
  const addon = (label, a) => a
    ? `<div><span class="k">${label}</span><span class="v">${yen(a.fee)} <em>/ ${chips(a.stack)} chips</em>${a.times ? ` <em>${esc(a.times)}</em>` : ""}</span></div>`
    : `<div><span class="k">${label}</span><span class="v x">—</span></div>`;
  const prizeBlock = ev.prize_tiers
    ? ev.prize_tiers.map(t => `<div class="tierlab">${esc(t.label)}</div>${ladderHTML(t.prizes)}`).join("")
    : (ev.prizes.length ? ladderHTML(ev.prizes) : "");
  const mult = ev.lb_mult / 10;

  return `<div class="sheet" id="sheet">
    <div class="sheet-bar">
      <button class="back" id="backBtn">← BACK</button>
      <span class="who">${p.md} ${p.w}</span>
    </div>
    <div class="wrap">
      <div class="hero">
        <div class="hero-line">
          <span class="hero-no">#${String(ev.no).padStart(2,"0")}</span>
          <span class="fmt ${fmtClass(ev.format)}">${esc(ev.format)}</span>
          ${tags.join("")}
        </div>
        <h2>${ev.subtitle ? `<small>${esc(ev.subtitle)}</small>` : ""}${esc(ev.title)}</h2>
        ${ev.guest ? `<div class="special" style="margin-top:14px">
            <div class="lab">${esc(ev.guest.label)}</div>
            <div class="hl">Guest : ${esc(ev.guest.name)}</div>
            <div class="bd">${esc(ev.guest.note)}</div></div>` : ""}
        <div class="hero-when">
          <div><div class="k">DATE</div><div class="v">${p.md}</div></div>
          <div><div class="k">START</div><div class="v">${esc(ev.start)}</div></div>
          <div><div class="k">REG-END</div><div class="v">${esc(ev.reg_end)}</div></div>
        </div>
      </div>

      ${r ? `<section class="blk"><h3>Result</h3>${finishersHTML(ev, r)}</section>` : ""}

      <section class="blk">
        <h3>Entry</h3>
        <div class="buyin">
          <div class="lead"><span class="k">ENTRY</span><span class="v">${feeText(e)} <em>/ ${chips(e.stack)} chips</em></span></div>
          ${addon("FREE ADD-ON", e.free_addon)}
          ${addon("LATE ADD-ON", e.late_addon)}
          <div><span class="k">RE-ENTRY</span><span class="v${e.reentry_fee ? "" : " x"}">${e.reentry_fee ? yen(e.reentry_fee) + ` <em>/ ${chips(e.stack)} chips</em>` : "—"}</span></div>
        </div>
        ${ev.notes && ev.notes.length ? `<ul class="notes">${ev.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      </section>

      ${ev.special ? `<section class="blk"><div class="special">
        <div class="lab">${esc(ev.special.label)}</div>
        <div class="hl">${esc(ev.special.headline)}</div>
        ${ev.special.body ? `<div class="bd">${esc(ev.special.body)}</div>` : ""}
      </div></section>` : ""}
      ${eclipseHTML(ev)}

      ${prizeBlock ? `<section class="blk"><h3>Tournament Prize</h3>${prizeBlock}
        ${ev.prize_note ? `<div class="prizenote">${esc(ev.prize_note)}</div>` : ""}</section>` : ""}

      <section class="blk"><h3>Structure</h3>${structureTable(ev)}</section>

      <section class="blk">
        <h3>Leaderboard Point</h3>
        <div class="lbrule">
          <ul class="notes">
            <li>優勝ポイント ＝ 総エントリー数 × 10（最低 200）${
              mult === 1 ? "" : ` × ${mult}（<b>PREMIER</b>）`}${
              r ? ` ＝ ${r.base}（${r.entries} エントリー）` : ""}</li>
            <li>以下1順位ごとに上位ポイントの 50%（5ポイント単位で切り上げ）。10ポイント未満は付与なし</li>
            <li>エントリーポイント ＝ 本人のエントリー数 × 10${mult === 1 ? "" : ` × ${mult}`}</li>
          </ul>
        </div>
      </section>

      <section class="blk venue">
        <h3>Venue</h3>
        <div class="vn">${esc(ev.venue)}</div>
        <div class="va">${esc(DATA.series.venue.address)}</div>
        <div class="vf">
          <div style="font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)">${esc(DATA.series.venue.fee_label)}</div>
          ${DATA.series.venue.fees.map(f => `<div class="r"><span>${esc(f.label)}${f.note ? " " + esc(f.note) : ""}</span><b>${esc(f.price)}</b></div>`).join("")}
        </div>
        ${ev.venue_extra ? `<div class="vx">${esc(ev.venue_extra)}</div>` : ""}
      </section>
      <button class="back-bottom" id="backBtn2">← BACK</button>
      ${footHTML()}
    </div>
  </div>`;
}

/* ── ルーティング ─────────────────────────────────────────────────── */
function render(toTop) {
  document.getElementById("app").innerHTML =
      state.tab === "schedule" ? renderSchedule()
    : state.tab === "results" ? renderResults()
    : state.tab === "leaderboard" ? renderLeaderboard()
    : state.tab === "champions" ? renderChampions()
    : state.tab === "feature" ? renderFeature()
    : renderInfo();
  document.querySelectorAll("#tabs .tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));
  tickCountdown();
  if (toTop) window.scrollTo(0, 0);
}
function openDetail(id) {
  const ev = DATA.events.find(e => e.id === id);
  if (!ev) return;
  document.getElementById("overlay").innerHTML = detailHTML(ev);
  document.body.style.overflow = "hidden";
}
function closeDetail() {
  document.getElementById("overlay").innerHTML = "";
  document.body.style.overflow = "";
}
document.addEventListener("click", ev => {
  const t = ev.target;
  const tab = t.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; state.lbAll = false; render(true); return; }
  const fmt = t.closest("[data-fmt]");
  if (fmt) { state.fmt = fmt.dataset.fmt; render(); return; }
  const tg = t.closest("[data-tag]");
  if (tg) {
    const v = tg.dataset.tag;
    state.tags = state.tags.includes(v) ? state.tags.filter(x => x !== v) : state.tags.concat(v);
    render(); return;
  }
  if (t.closest("[data-sat]")) { state.satOnly = !state.satOnly; render(); return; }
  if (t.closest("[data-favonly]")) { state.favOnly = !state.favOnly; render(); return; }
  const fv = t.closest("[data-fav]");
  if (fv) { toggleFav(fv.dataset.fav); render(); return; }
  const day = t.closest("[data-day]");
  if (day) { state.day = day.dataset.day; render(); return; }
  if (t.closest("[data-lball]")) { state.lbAll = true; render(); return; }
  if (t.closest("[data-ring]")) { openRing(); return; }
  const row = t.closest("[data-ev]");
  if (row) { openDetail(row.dataset.ev); return; }
  if (t.closest("#backBtn") || t.closest("#backBtn2")) { closeDetail(); return; }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && document.getElementById("sheet")) closeDetail();
});

/* ── 起動 ─────────────────────────────────────────────────────────── */
function measureTop() {
  const h = document.querySelector(".top").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--topbar", Math.round(h) + "px");
}
/* iPhone で横幅が端末幅に固定されないことがあるので、無ければ自分で入れる。
   viewport の指定が無いと 980px でレイアウトされて全体が縮小表示になる。 */
(function viewport(){
  if (document.querySelector('meta[name="viewport"]')) return;
  const m = document.createElement("meta");
  m.name = "viewport"; m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(m);
})();

(function boot() {
  /* ヘッダは1行に収める必要があるので、シリーズ名が長いときだけ短縮名に落とす。
     Erz.26:Anniversary は 375px 幅でも収まるのでそのまま出る。 */
  const sname = DATA.series.name;
  const topName = document.getElementById("topName");
  if (DATA.series.title_logo) {
    const img = document.createElement("img");
    img.className = "titlelogo"; img.src = DATA.series.title_logo; img.alt = sname;
    topName.replaceChildren(img);
  } else {
    topName.textContent = (sname.length > 22 && DATA.series.short_name)
      ? DATA.series.short_name : sname;
  }
  document.getElementById("topSub").textContent = DATA.series.tagline;
  const ch = DATA.series.champions;
  const ctab = document.getElementById("champTab");
  if (ch && champPlayers().length && ctab) { ctab.textContent = ch.tab || "CHAMPIONS"; ctab.hidden = false; }
  const ft = DATA.series.feature;
  const ftab = document.getElementById("featTab");
  if (ft && ftab) { ftab.textContent = ft.tab || "SPECIAL"; ftab.hidden = false; }
  const ts = document.getElementById("topSns");
  if (ts) ts.innerHTML = snsMiniHTML().replace(/^<div class="sns-mini">|<\/div>$/g, "");
  const st = document.getElementById("topState");
  st.textContent = seriesState();
  st.classList.toggle("live", /^Day /.test(st.textContent));
  if (DATA.series.status === "live") st.classList.add("live");
  render();
  measureTop();
  window.addEventListener("resize", measureTop);
})();
